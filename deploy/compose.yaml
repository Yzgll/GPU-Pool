
services:
  postgres:
    # PostgreSQL 18 官方镜像
    image: postgres:18
    container_name: gpu-pool-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      # 仅允许本机访问数据库
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      # PostgreSQL 18 持久化数据
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: gpu-pool-postgres-data
